l_simp_chinese:
 ##Parties##


 ## Ideas ##

 ##Focuses##
 WOR_KIR_Vermillion_Realm:0 "朱红四境"
 WOR_KIR_Vermillion_Realm_desc:0 "新年的钟声已经敲响，新任首相秋烨，以及她的政府，也即将正式开始运作。年轻富有理想的首相，以及她蹄中的改革计划，必定能将四境引向更加光明的未来。"
 WOR_KIR_Preparation_for_construction:0 "代表入局"
 WOR_KIR_Preparation_for_construction_desc:0 "为了实现“跃龙门”改革计划，我们需要来自四境各个阶层的帮助，为此我们将向麒里亚的各个政治团体发出承诺与邀请，诚邀他们派出代表加入正在筹备的改革委员会，为四境贡献出自己的力量。"
 WOR_KIR_Delegates_Admission:0 "筹备建设"
 WOR_KIR_Delegates_Admission_desc:0 "“君子三思而后行”，在建设开始前，我们应当先获取四境各产业相关的数据，进而好制定发展的计划。改革委员会中来自社会各界的代表们将会帮助我们。"
 WOR_KIR_Industrial_Planning_Department:0 "工业规划局"
 WOR_KIR_Industrial_Planning_Department_desc:0 "若是要强国，则不可不兴业，也不可无建设的规划。我们将组建专门的统筹机构，进而统一规划四境的轻重工业、铁路、电力等产业的发展建设。"
 WOR_KIR_Attract_Investment:0 "吸引招商投资"
 WOR_KIR_Attract_Investment:0 "国家的强盛，全民的幸福，都同商业不可分割地联系在一起。 正如溢明圣师所言：“商务者,国家之元气。通商者，疏畅其血脉也”。我们将通过政策利好等方式，吸引各国资本前来投资，四境庞大的市场，充足的劳动力，以及丰富的原料将会深深地吸引他们。"
 WOR_KIR_Introducing_technology:0 "进口科技"
 WOR_KIR_Introducing_technology:0 "在一些建筑技术领域上，我们远落后于世界，我们将向小马利亚的朋友们求援，采购获取一些技术。"
 WOR_KIR_Light_industry_leap_forward:0 "轻工业跃进"
 WOR_KIR_Light_industry_leap_forward:0 "四境的轻工业已经得到了发展，如今，在江源城，马哈顿，卡廷，或是阿里斯山的货架上，都可以找到由麒里亚生产的商品了。"
 WOR_KIR_Reconstruction_of_farmland:0 "重修田亩"
 WOR_KIR_Reconstruction_of_farmland_desc:0 "麒里亚是一个以农为本的国家，了解农业的基本状况至关重要。同样的，唯有清丈土地，确定确切的土地数据，才能进而敲定税赋。"
 WOR_KIR_Land_Reform:0 "土地改革"
 WOR_KIR_Land_Reform_desc:0 "我们要常常念着农民的痛苦，常常念着他们所想得的幸福，降低农业税赋，减轻农民的负担，唯有如此施以仁政，才能行之久远。"
 WOR_KIR_Promote_banking:0 "发展银行业"
 WOR_KIR_Promote_banking_desc:0 "金钱必须流通，若蹄中的财富不流通，就无法被任何人接收和使用。鼓励金融行业与银行业的发展将会解决这一问题，让麒麟们蹄中的积蓄被集中起来用于投资，随着投资回报，工商业将得到发展，进而再让储户们的财富增加。"
 WOR_KIR_Thousands_of_hammers_and_chisels_carved_out_the_mountains:0 "千锤万凿出深山"
 WOR_KIR_Thousands_of_hammers_and_chisels_carved_out_the_mountains_desc:0 "四境之大，物产丰隆，此为时雍为麒麟种族赐福的无尽藏也。我们将在全国开展地理勘探，标记并发掘各类资源。"
 WOR_KIR_Manufacturing_Development:0 "发展制造业"
 WOR_KIR_Manufacturing_Development_desc:0 "随着轻工业与技术的进步，我们将进一步发展自主制造业，促进行业的技术升级。其中，机械制造产业更是重中之重，虽然短期收益低下，但长此以往，将会帮助我们的工业发展。"
 WOR_KIR_Industrialization_takes_off:0 "工业化腾飞"
 WOR_KIR_Industrialization_takes_off_desc:0 "一座座工厂在四境大地上拔地而起，一项项科学技术投入到生产环节当中，我们正处在发展的快车道上，我们将重返繁荣与辉煌。"
 WOR_KIR_Road_network_plan:0 "四境路网计划"
 WOR_KIR_Road_network_plan_desc:0 "要致富，必修路。商品，旅客，劳工，原料，产品……都需要铁路、公路以及航运的运输。首相提出了一系列的道路修建计划，这些计划同样会进一步拉动建筑行业发展，增加更多的就业岗位。"
 WOR_KIR_Developing_the_inland_river_economy:0 "发展内河经济"
 WOR_KIR_Developing_the_inland_river_economy_desc:0 "四境之内有着繁多的溪河江湖，彼此交错的河网勾勒出了四境大地，它们构成了贯通各地的内河水上交通线，在路网建设起步的同时，我们应当鼓励内河航运，以促进各地的贸易流通，进而发展沿岸地区的经济。济"
 WOR_KIR_Developer_Portal:0 "开发商埠"
 WOR_KIR_Developer_Portal_desc:0 "在“沉默”之时，三大开放口岸与风信城出岛就已形成了成熟的贸易网络，把其影响扩散都周围地区，这样可以拉动周边地区的快速发展，同时缓解这些城市的发展压力。"
 WOR_KIR_Limiting_the_urban_rural_gap:0 "限制城乡差距"
 WOR_KIR_Limiting_the_urban_rural_gap_desc:0 "我们不能忘记，数万麒麟居住在农村乡镇，若是城乡分化过大，那四境将再无种田的农民，而城市的扩张速度也会远超其承载力的发展。在问题积恶成习之前解决再好不过了，我们将尽力限制城乡差距并发展乡镇，而不是放任“市场无形的蹄”来决定一切。"
 WOR_KIR_Realm_electrification:0 "四境电气化"
 WOR_KIR_Realm_electrification_desc:0 "倘若在几年前，我们提出说要将麒里亚电气化，一定会得到嘲笑与讥讽。但现在，电气化对于四境已再是遥不可及的梦想。有朝一日，光亮将顺着电网，通向四境南北的千家万户。"
 WOR_KIR_Agricultural_mechanization:0 "农业机械化"
 WOR_KIR_Agricultural_mechanization_desc:0 "农业不能只依赖于农民辛勤的耕种。推广机械化将会缓解农业麟口不断流失的问题，同时提高种植、劳动、收割的效率。"
 WOR_KIR_Ensure_the_red_line:0 "“红线”确保"
 WOR_KIR_Ensure_the_red_line_desc:0 "“工业农业，城市村镇的扩张都会不可避免地占用土地。但毫无节制地占用耕地，迟早只会陷入无地可种的尴尬情况，如此趋势必须遏制。"
 WOR_KIR_Food_procurement_issues:0 "粮食收购问题"
 WOR_KIR_Food_procurement_issues_desc:0 "粮食并不是凭空一下就从农户的粮仓里出现在消费者碗中的，而是通过收购、经销等中间环节，才能完成交易。但是必须立法规范市场，并且用行政确保，没有麒麟会想再经历“998年南方米骚动”那样的事了。"
 WOR_KIR_A_step_into_modernization:0 "一蹄迈入现代化"
 WOR_KIR_A_step_into_modernization_desc:0 "过去几年里，我们顽强地奋斗，埋头苦干，如今，麒里亚已经摆脱了落后，我们的一蹄已踏入现代化社会当中，现代化的进程不会就此停下，四境的麒麟们，将在这充满梦想与希望的土地上继续前进。"
 WOR_KIR_Law_of_Realms:0 "敲定国策"
 WOR_KIR_Law_of_Realms_desc:0 "政治改革的第一要务，莫过于敲定基本国策与施政方针，秋烨首相已经准备了一份提案。当然，其中的一些议题仍需要同其他政治团体进行磋商，在一切达成共识后，方才能将提案递交到内阁桌前。"
 WOR_KIR_Abolition_of_prison:0 "废除聒狱"
 WOR_KIR_Abolition_of_prison_desc:0 "若要建设四境，则要让四境的麒麟们都可以发出自己的声音。我们将废除酷刑，并且将聒狱送进历史的博物馆中。"
 WOR_KIR_Administrative_modernization:0 "行政现代化"
 WOR_KIR_Administrative_modernization_desc:0 "四境有着不少的官僚阶层，正是因为这些不计其数的官员，朱京宫廷与女族长的旨意才能够执行下去。但如今，这台巨大的机械各处都出现了生锈损坏。我们将逐级开始实行行政改革，稳步地将四境的行政现代化。"
 WOR_KIR_Open_public_discussion:0 "广开公议"
 WOR_KIR_Open_public_discussion_desc:0 "四境有着不少的官僚阶层，正是因为这些不计其数的官员，朱京宫廷与女族长的旨意才能够执行下去。但如今，这台巨大的机械各处都出现了生锈损坏。我们将逐级开始实行行政改革，稳步地将四境的行政现代化。"
 WOR_KIR_Anti_Corruption_Office:0 "反腐办公室"
 WOR_KIR_Anti_Corruption_Office_desc:0 "君子爱财，取之有道。对于一些官员，他们账户上凭空增加的数字，不是一句“时雍的馈赠”就能糊弄过去的。这种“政治献金”问题必须解决，对于贪污分子必须坚决处理。"
 WOR_KIR_Promise_to_convene_Congress:0 "承诺召开国会"
 WOR_KIR_Promise_to_convene_Congress_desc:0 "我们不能忘记，“跃龙门”改革归根结底究竟是为了谁，我们必须回应广大麒麟们的愿望。改革将会稳步向前，而最终，我们将召开全国国会，正式在四境实行民主制度"
 WOR_KIR_Limiting_local_power:0 "法定权力"
 WOR_KIR_Limiting_local_power_desc:0 "权力是一把双刃剑，它可以让最优秀的麒麟变成最下流的腐败分子。我们必须通过行政相关立法，限制各地官员们蹄中的权力。让他们时刻牢记，他们的权力并不完全属于他们。"
 WOR_KIR_High_Matriarch:0 "至高女族长之位"
 WOR_KIR_High_Matriarch_desc:0 "至高女族长与国会之间究竟是怎样的关系？我们需要在二者之间谨慎地取得平衡。正如离罗之道与“圣师”溢明所教导我们的那样：“致中和，是谓之道。”"
 WOR_KIR_Appease_the_nobles:0 "安抚士族"
 WOR_KIR_Appease_the_nobles_desc:0 "自“跃龙门”改革开始以来，不少士族们便抱着消极甚至反对的态度，或许我们可以给予他们一些头衔、优待以平息他们的不满，而我们要做的是在他们的孩子继承时逐级削减待遇，这样就无须担心数十年后我们的财政被吃垮了。"
 WOR_KIR_Good_law_and_good_governance:0 "良法善治"
 WOR_KIR_Good_law_and_good_governance_desc:0 "法治兴则国兴，法治强则国强。仅仅有优秀的官员不足以治理天下，还需要相应的法律来保障。若我们不愿“麟亡政熄”，则修订法律规章。"
 WOR_KIR_Advancing_political_reform:0 "推进政治改革"
 WOR_KIR_Advancing_political_reform_desc:0 "几年过去，改革已是硕果累累，离成功已然不远了。我们现在可以着手推进下一阶段的民主改革了，从政党制度再到行政民主化的预备，时间不等麟。
 WOR_KIR_Reforming_the_Church:0 "革新离罗之道"
 WOR_KIR_Reforming_the_Church_desc:0 "麒麟们不会忘记，是离罗之道与溢明教会了他们克制自己情绪，达到“二我合一”，而不变为浑身着火的逆麟。但作为思想，离罗之道也应当适当革新，与时俱进了。"
 WOR_KIR_Reforming_local_administration:0 "改革地方行政"
 WOR_KIR_Reforming_local_administration_desc:0 "四境之大，朱京的号令千遍，最终仍需要地方政府执行，我们将在两者间寻求一种妥协，在地方政府拥有一定自主性，可以发挥活力的同时，确保中央政府的法令可以得到执行。"
 WOR_KIR_Rapidly_develop_the_talent_in_need:0 "快速培养所需麟才"
 WOR_KIR_Rapidly_develop_the_talent_in_need_desc:0 "建设的开展，少不了建设的才俊能干。教育学家提出我们可以开设不同与公学的特别专科学校，快速培养技术熟练麟才，同时同企业合作，加强产业员工培训，解决“无麟可用”的难题。"
 WOR_KIR_Reforming_the_system_of_selecting_officials:0 "改革考举制"
 WOR_KIR_Reforming_the_system_of_selecting_officials_desc:0 "作为四境选官制度的考举制度已经实行了近百年，在现代国家的行政压力面前，这样的选官制度已经无法完美应对了。我们将参考河间地与小马利亚的经验，适当变更考核与选拔程序。"
 WOR_KIR_Modernization_of_education:0 "教育现代化"
 WOR_KIR_Modernization_of_education_desc:0 "教育是立国根基之一，其重要性不言而喻。如今“四品四试”已然不能覆盖所有知识，在现代学科分化面前，我们不得不改革我们的教育。"
 WOR_KIR_Universal_basic_education:0 "普及基础教育"
 WOR_KIR_Universal_basic_education_desc:0 "教育，是一片云推动另一片云，是一只麒麟教导另一只麒麟。若是仅有少数麒麟受到教育，则四境的富强难以保障，我们必须实行广泛的基础教育普及，让四境的每一只青年麒麟，都能进入公学就读。"
 WOR_KIR_Reevaluating_status:0 "重审地位"
 WOR_KIR_Reevaluating_status_desc:0 "新任政府开始运作，随着而来的便是对一切工作的重新评估，外交方面也不例外。我们应当决定好接下来的外交方针方略，万事开头难，但我们已经做好准备。"
 WOR_KIR_Zai_Kiria:0 "甾麒里亚？"
 WOR_KIR_Zai_Kiria_desc:0 "甾麒里亚——921甾麒里亚战争最终以南方三国的事实独立告终，此后麒里亚与他们只有名义上的朝贡关系。如今随着我们外交方针的变化，南方问题又一次被置于台前。"
 WOR_KIR_Establishment_of_weapons_design_bureau:0 "建立武器设计局"
 WOR_KIR_Establishment_of_weapons_design_bureau_desc:0 "四境旗军旗兵有着骁勇善战的历史，但光是荣耀是换不来胜利的。我们将向小马利亚顾问团请求军事技术支援，同时开始逆向自研工程，这会让我们少走不少弯路。"
 WOR_KIR_Military_construction:0 "军工建设"
 WOR_KIR_Military_construction_desc:0 "一支军队，若是没有成体系的武器与弹药供应，或许一开始可以取胜几次，但随着时间推移，其最终也只能投降。军事工业的建设，刻不容缓。"
 WOR_KIR_Targeting_strong_enemies:0 "瞄准强敌练"
 WOR_KIR_Targeting_strong_enemies_desc:0 "自从上次战争以来，四境已经维持了几十年的和平，我们刀枪是否已经生锈？我们能否捍卫自己的家园？唯有操练起来，这样，倘若真有敌人进攻麒里亚，我们都能有信心与实力战胜他们。"
 WOR_KIR_Experimental_armor_design:0 "实验性装甲设计"
 WOR_KIR_Experimental_armor_design_desc:0 "根据各国军事家的分析，坦克，这一攻防兼具的兵器，其战争潜力是难以估量的。虽然四境的旗军绝非强大，但我们也应当具有一定的远见，现在就开始早期装甲力量的研究，而不是等到被人远远甩开，才想起奋力追赶。"
 WOR_KIR_Border_Defense_Program:0 "四境防务大纲"
 WOR_KIR_Border_Defense_Program_desc:0 "四境广大而复杂的地形地势，决定了我们必须提前规划防御计划。在国土防御的问题上，任何一个方向都必须被考量在内，不由得半点马虎。"
 WOR_KIR_Autonomous_design:0 "自主化设计"
 WOR_KIR_Autonomous_design_desc:0 "通过一定时间的逆向研发，以及自主创新设计，我们已经具备了一定的自主研发与生产能力，这会大大提升我们军队的科技水平。我们最终的目标是，到达，甚至领先世界先进水平。"
 WOR_KIR_Reorganization_Banners_Army:0 "重整旗兵"
 WOR_KIR_Reorganization_Banners_Army_desc:0 "坦率的说，麒里亚的军事现状不容乐观，最高统帅部已经提出了具体的军事改革方案，第一步便是整备我们目前已有的军队，重组编制，为一切打下基础"
 WOR_KIR_System_Reconstruction:0 "体系重构"
 WOR_KIR_System_Reconstruction_desc:0 "世界瞬息万变，而身为世界的一部分，我们也不得不紧跟变革的步伐。是时候重新改革我们的军队体系了，让四境旗军蜕变为一只现代化的国防力量。"
 WOR_KIR_Grillo_Military_Academy:0 "铅黄军校"
 WOR_KIR_Grillo_Military_Academy_desc:0 "有了新技术新武器，也得有麒麟来用才行。在旗军的发源地铅黄，我们将建起新的军事学堂，为军队源源不断地培养高质量的士官与军官，确保军队的战斗力。"
 WOR_KIR_Promote_new_officers:0 "提拔新军官"
 WOR_KIR_Promote_new_officers_desc:0 "并非所有人都能适应崭新的时代，创造历史的可不是老人。如今我们的将领团队需要新鲜血液，相信旗军从不缺年轻有为、志向远大的军官。我们将晋升他们，逐步组建现代的指挥团队。"
 WOR_KIR_Modernization_of_doctrine:0 "学说现代化"
 WOR_KIR_Modernization_of_doctrine_desc:0 "随着军队的人事变动，以及我军技术的进步，我们对现代战争已经有了一定的认知，根据这些经验，我们将逐步现代化我们的作战学说，加快军事改革的步伐。"
 WOR_KIR_Duties_to_guard_territory:0 "守土职责"
 WOR_KIR_Duties_to_guard_territory_desc:0 "我们不喜好战争，但倘若哪一天，有人将战火烧到四境，作为时雍的子民，我们会向他们展现我们的意志与力量，让一切来犯之敌在烈焰中灭亡。"
 WOR_KIR_Develop_the_Coast:0 "开发沿海"
 WOR_KIR_Develop_the_Coast_desc:0 "位于东斑马里加的麒里亚，拥有着漫长的海岸线，其中不乏优质的港湾。随着国家实力的增长，我们总算可以腾出蹄子来开发沿海，修建船厂，并且重整海军舰队了。"
 WOR_KIR_Blue_Water_Navy:0 "蓝水海军"
 WOR_KIR_Blue_Water_Navy_desc:0 "四境的海军目前仍是以近海防卫为目标的绿水海军，但是我们有着走向蓝水的梦想。有朝一日，我们的舰队可以越过泛大洋，去往世界上的任何一个国家，这不是痴麟说梦，而是十年内将发生的未来。"
 WOR_KIR_Order_foreign_designs:0 "订购外国设计"
 WOR_KIR_Order_foreign_designs_desc:0 "我们的舰艇有不少已经落后于时代，并且逼近服役年限了。针对目前我们的研发与造舰能力，我们可以采取买造齐步走的办法，即订购外国的合适设计后，派出我们的技术人员们前去参与建造，最终实现可以在我们自己的船厂组装同级舰船。"
 WOR_KIR_Military_modernization:0 "现代化军队"
 WOR_KIR_Military_modernization_desc:0 "“士别三日，当刮目相待”，如今的四境旗军，已然是一只现代化的军队。倘若类似829年殖民战争的事情再次上演，我们有信心，驱逐任何胆敢侵犯麒里亚领土领海的敌人。"
 WOR_KIR_The_First_Congress:0 "第一届麒里亚国会"
 WOR_KIR_The_First_Congress_desc:0 "几年来，我们在四境播种希望，耕耘果实，如今，作为时雍的子民，我们可以迎着朝阳，自信昂起自己的头颅，看着千万麒麟走向新的天地。\n\n让我们步入第一届国会的会场吧，不分党派与意识形态，让我们今日在此欢聚。麒里亚与她的麒麟们，会记下这历史的一天。"